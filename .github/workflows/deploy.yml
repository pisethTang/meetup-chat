# Build the page and publish it to GitHub Pages on every push to main
# (or by hand from the Actions tab). Site: https://pisethtang.github.io/meetup-chat/
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages deploys need to write to Pages and prove who they are (OIDC token); nothing else.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let a running deploy finish rather than cancelling it halfway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.0

      - name: Install dev dependencies (TypeScript, Leaflet types)
        run: bun install --frozen-lockfile

      - name: Type-check
        run: bun run typecheck

      - name: Build dist/coffee-midpoint.js
        run: bun run build

      # Only what the page needs. coffee-midpoint.html is also published as index.html
      # so the site root opens the app.
      - name: Assemble site
        run: |
          mkdir -p _site/dist
          cp coffee-midpoint.html _site/index.html
          cp coffee-midpoint.html coffee-midpoint.css _site/
          cp dist/coffee-midpoint.js _site/dist/

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
